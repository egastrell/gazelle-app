<!--
  GAZELLE — reescrito de cero el 26/09/2026.

  POR QUÉ SE TIRÓ LA ANTERIOR (1.576 líneas, guardada en legacy/index-bs2.html):
  estaba diseñada para Baby Step 2 — matar deuda. De ahí las pestañas
  "Prohibidos" y "A Pagar", el nombre "Modo Gazelle" (el término de Ramsey para
  el pago intenso de deuda) y variables llamadas deudaPct / deudaBar /
  deudaActual. BS2 terminó en mayo de 2026. BS3 es la actividad CONTRARIA: no
  vigilar que la plata no salga, sino que una transferencia entre. La app nunca
  se rehizo para la etapa nueva, se fue parchando, y cada parche dejó una capa.
  Así aparecieron cinco cifras que mentían, todas hacia "tenés más de lo que
  tenés" — la peor decía 5 meses para el fondo cuando eran 55.

  LAS CUATRO REGLAS DE ESTA VERSIÓN:
  1. Ningún número sin fuente. Cada cifra dice de dónde sale y de cuándo es.
  2. Si no se sabe, se dice. Cero valores por defecto: un default optimista y
     mudo es peor que una pantalla vacía.
  3. Lo que autoriza gasto nunca es lo más grande de la pantalla.
  4. La única métrica de éxito es el historial de aportes. Lo demás es contexto.
-->

<script>
'use strict';
// ══════════════════════════════════════════════════════════════════════
// FORMATO — es-AR. Punto para miles, coma para decimales.
// ══════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const fp = n => '$' + Math.round(Math.abs(n)).toLocaleString('es-AR');
const fusd = n => 'US$ ' + Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad2 = n => String(n).padStart(2,'0');
const hoyISO = () => { const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
const mesISO = () => hoyISO().slice(0,7);

// Texto escrito a mano: "184.500" son ciento ochenta y cuatro mil, no 184,5.
function num(s){
  if(s===null||s===undefined) return NaN;
  let t = String(s).replace(/[^0-9.,-]/g,'');
  if(!t) return NaN;
  if(t.indexOf(',')>-1) t = t.replace(/\./g,'').replace(',','.');
  else if(/\.\d{3}(\.\d{3})*$/.test(t)) t = t.replace(/\./g,'');
  return parseFloat(t);
}
// Celdas del Sheet: mezcla de números y texto argentino ("8.389,41").
// parseFloat("8.389,41") devuelve 8,389 — mil veces menos.
function celda(v){
  if(typeof v === 'number') return v;
  let s = String(v==null?'':v).replace(/\$/g,'').trim();
  if(!s) return NaN;
  const neg = s.charAt(0)==='(' || s.charAt(0)==='-';
  s = s.replace(/[()\-\s]/g,'');
  if(/,\d{1,2}$/.test(s)) s = s.replace(/\./g,'').replace(',','.');   // 8.389,41
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');     // 12.000 = doce mil
  else s = s.replace(/,/g,'');                                        // 8389.41 / 8389
  const n = parseFloat(s);
  return isNaN(n) ? NaN : (neg ? -n : n);
}
function fechaDe(v){
  if(v instanceof Date) return v;
  const s = String(v==null?'':v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ let a=+m[3]; if(a<100) a+=2000; return new Date(a,+m[2]-1,+m[1]); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}

// ══════════════════════════════════════════════════════════════════════
// ESTADO — todo lo que la app sabe, y de dónde lo sacó.
// Regla 1: si algo falta queda null y la pantalla lo dice. Nunca un default:
// el viejo fondo_bs3_usd:3643 pintaba 59% de la meta donde el real era 51%.
// ══════════════════════════════════════════════════════════════════════
const S = { cfg:{}, cfgOk:false, mep:null, mepOk:false, tc:[], mp:[], sheetOk:false, ultimaTC:null, ultimaMP:null };
const DIAS_FRESCO = 7;
const apiUrl = () => (localStorage.getItem('gazelle_api_url')||'').trim();
const hoja = n => { const b=apiUrl(); return b ? b+(b.indexOf('?')>-1?'&':'?')+'hoja='+encodeURIComponent(n) : null; };

const LS = {
  get aportes(){ try{ return JSON.parse(localStorage.getItem('gazelle_aportes')||'[]'); }catch(e){ return []; } },
  set aportes(v){ localStorage.setItem('gazelle_aportes', JSON.stringify(v)); },
  // Etapa 1 de la Regla Maestra: $80.000, que es la baja de los débitos de Mirta.
  get montoAporte(){ const v=localStorage.getItem('gazelle_aporte_monto'); return v===null?80000:parseFloat(v); },
  set montoAporte(v){ localStorage.setItem('gazelle_aporte_monto', v); },
  get sobre(){ const v=localStorage.getItem('gazelle_sobre'); return v===null?null:parseFloat(v); },
  get sobreFecha(){ const f=localStorage.getItem('gazelle_sobre_fecha'); return f?new Date(f):null; },
  setSobre(v){ localStorage.setItem('gazelle_sobre',Math.max(0,v)); localStorage.setItem('gazelle_sobre_fecha',new Date().toISOString()); },
  // Bajado de $210.000 el 26/09: el techo salía de lo que se giraba, no del gasto.
  get giro(){ const v=localStorage.getItem('gazelle_giro'); return v===null?150000:parseFloat(v); }
};

// ══════════════════════════════════════════════════════════════════════
// FONDO
// ══════════════════════════════════════════════════════════════════════
function fondo(){
  const usd=S.cfg.fondo_bs3_usd, meta=S.cfg.meta_bs3_minimo;
  if(!usd||!meta||!S.mep) return null;
  const pesos=Math.round(usd*S.mep);
  return { usd, meta, pesos, pct:Math.min(pesos/meta*100,100), falta:Math.max(meta-pesos,0) };
}
// El ritmo sale de lo que se transfirió DE VERDAD. Con menos de dos aportes no
// hay promedio: se usa el planificado y se aclara que es un plan.
function ritmo(){
  const h=LS.aportes;
  if(h.length>=2) return { monto:h.reduce((s,a)=>s+a.monto,0)/h.length, real:true, n:h.length };
  return { monto:LS.montoAporte, real:false, n:h.length };
}
function llegada(falta, porMes){
  if(!porMes||porMes<=0||falta<=0) return null;
  const m=Math.ceil(falta/porMes), d=new Date();
  d.setMonth(d.getMonth()+m);
  return { meses:m, texto:MESES[d.getMonth()]+' '+d.getFullYear() };
}

// ══════════════════════════════════════════════════════════════════════
// ALIMENTACIÓN — el sobre de MercadoPago.
// El saldo lo carga Eduardo: es el único dato en tiempo real que existe. El
// Sheet llega con semanas de atraso, así que un ritmo calculado sobre él
// siempre daría de más. Vencido el saldo, la app dice que no sabe.
// ══════════════════════════════════════════════════════════════════════
function proxLunes(){
  const h=new Date(); h.setHours(0,0,0,0);
  let d=(1-h.getDay()+7)%7; if(d===0) d=7;
  const p=new Date(h); p.setDate(p.getDate()+d); return p;
}
function sobre(){
  const saldo=LS.sobre, ref=LS.giro/7;
  const h=new Date(); h.setHours(0,0,0,0);
  const dias=Math.round((proxLunes()-h)/864e5);
  if(saldo===null) return { ref, dias, sinDato:true };
  const horas = LS.sobreFecha ? Math.floor((Date.now()-LS.sobreFecha.getTime())/36e5) : null;
  const crudo = dias>0 ? saldo/dias : saldo;
  return {
    ref, dias, saldo, horas,
    vencido: horas===null || horas>48,
    // Tope en la referencia: si sobró de la semana pasada eso es ahorro, no
    // permiso para gastar el doble el sábado. El excedente se muestra aparte.
    porDia: Math.min(crudo, ref),
    ratio: ref>0 ? crudo/ref : 0,
    excedente: Math.max(0, saldo - ref*dias)
  };
}

// ══════════════════════════════════════════════════════════════════════
// CICLO — anteúltimo jueves. Se calcula al vuelo: la versión anterior
// precomputaba una tabla que se terminaba en 2028 y después caía al último
// ciclo sin avisar, mostrando "$0 gastado" para siempre.
// ══════════════════════════════════════════════════════════════════════
function anteultimoJueves(a,m){
  const j=[], d=new Date(a,m,1);
  while(d.getMonth()===m){ if(d.getDay()===4) j.push(new Date(d)); d.setDate(d.getDate()+1); }
  const f=j[j.length-2]; f.setHours(0,0,0,0); return f;
}
function ciclo(){
  const h=new Date(); h.setHours(0,0,0,0);
  let a=h.getFullYear(), m=h.getMonth();
  let fin=anteultimoJueves(a,m), pa=a, pm=m-1;
  if(h>fin){ pm=m; m++; if(m>11){m=0;a++;} fin=anteultimoJueves(a,m); }
  if(pm<0){ pm=11; pa=a-1; }
  const ini=new Date(anteultimoJueves(pa,pm)); ini.setDate(ini.getDate()+1); ini.setHours(0,0,0,0);
  return { ini, fin, dias:Math.max(Math.ceil((fin-h)/864e5)+1,0) };
}

// ══════════════════════════════════════════════════════════════════════
// DATOS DEL SHEET
// ══════════════════════════════════════════════════════════════════════
const EXCL = ['Pago Tarjeta','Banco','Transferencia Interna','Diezmo'];
const USD_MERCH = ['GOOGLE *CLAUDE','GOOGLE *CHATGPT','GOOGLE *GOOGLE O','MAKE.COM'];

async function cargarTodo(){
  await Promise.all([cargarConfig(), cargarMep()]);
  await cargarSheet();
  pintar();
}
async function cargarConfig(){
  const u=hoja('Config'); if(!u) return;
  try{
    const r=await fetch(u); if(!r.ok) throw 0;
    const j=await r.json(); if(!Array.isArray(j.values)) throw 0;
    const c={};
    j.values.forEach(function(f){ if(f&&f[0]){ const v=celda(f[1]); if(!isNaN(v)) c[String(f[0]).trim()]=v; } });
    S.cfg=c; S.cfgOk=true;
  }catch(e){ S.cfgOk=false; }
}
async function cargarMep(){
  try{
    const r=await fetch('https://dolarapi.com/v1/dolares/bolsa'); if(!r.ok) throw 0;
    const d=await r.json();
    const v=(d.venta&&d.compra)?(d.venta+d.compra)/2:d.venta;
    if(v>0){ S.mep=v; S.mepOk=true; }
  }catch(e){ S.mepOk=false; }
}
async function cargarSheet(){
  const uT=hoja('Tarjetas'), uM=hoja('MercadoPago');
  if(!uT) return;
  try{
    const rT=await fetch(uT);
    if(!rT.ok) throw 0;
    S.tc=filas((await rT.json()).values,'tc');
    try{ const rM=await fetch(uM); if(rM.ok) S.mp=filas((await rM.json()).values,'mp'); }catch(e){}
    S.sheetOk=true;
  }catch(e){ S.sheetOk=false; }
}
function filas(vals, tipo){
  if(!Array.isArray(vals)||vals.length<2) return [];
  const cols=vals[0];
  const g=function(r,n){ const i=cols.indexOf(n); return i>=0&&r[i]!==undefined?String(r[i]):''; };
  const out=[]; let ult=null;
  vals.slice(1).forEach(function(r){
    if(!r||!r[0]) return;
    const f=fechaDe(g(r,'Fecha')); if(f&&(!ult||f>ult)) ult=f;
    // CLAUDE.md manda excluir a los padres y durante meses no se leía en ningún
    // lado: 197 filas y $4.009.227 se contaban como gasto del Núcleo.
    const usr=g(r,'USUARIO'), fam=g(r,'Familia').trim();
    if(fam==='Padres'||usr.indexOf('SEGOVIA')>-1||usr.indexOf('ALFREDO')>-1) return;
    const cat=(g(r,'Categoria')||'Otros').trim();
    const desc=(tipo==='tc'?(g(r,'Comercio')||g(r,'DescripcionRaw')):(g(r,'TipoMovimiento')||g(r,'Descripcion'))).trim();
    let monto=celda(g(r,'Monto')); if(isNaN(monto)) return;
    if(tipo==='tc'){
      const up=desc.toUpperCase();
      const mon=g(r,'Moneda').trim().toUpperCase() ||
        ((/,\s*USD\s*,/i.test(desc)||USD_MERCH.some(function(m){return up.indexOf(m)>-1;}))?'USD':'ARS');
      if(mon==='USD') return;                    // los dólares no se suman a los pesos
      if(g(r,'Signo')==='E') monto=-monto;
      const cu=celda(g(r,'Cuotas'));
      if(g(r,'Fuente')!=='PDF'&&!isNaN(cu)&&cu>1) monto=monto/cu;
    }else{
      if(monto>=0) return;                       // en MP solo cuentan los egresos
      monto=Math.abs(monto);
    }
    if(monto<=0||EXCL.indexOf(cat)>-1) return;
    out.push({f:f, cat:cat, desc:desc, monto:monto, fuente:tipo==='tc'?'Tarjeta':'MercadoPago'});
  });
  if(tipo==='tc') S.ultimaTC=ult; else S.ultimaMP=ult;
  return out;
}
const diasDesde = d => d ? Math.floor((new Date()-d)/864e5) : null;

// ══════════════════════════════════════════════════════════════════════
// PANTALLA "HOY" — lo que hay que hacer ahora, y nada más.
// El orden NO es fijo: el día de cobro manda el aporte, el resto de los días
// manda el sobre. La tarjeta que importa hoy es la grande.
// ══════════════════════════════════════════════════════════════════════
const inputSobre = () => '<div class="fila"><input id="inSobre" inputmode="decimal" placeholder="Saldo del sobre en MP"><button onclick="guardarSobre()">Actualizar</button></div>';

function pintarHoy(){
  const F=fondo(), R=ritmo(), A=sobre();
  const hecho=LS.aportes.some(function(a){return a.mes===mesISO();});
  const d=new Date().getDate();
  const tocaAporte = !hecho && (d>=26||d<=2);
  const h=[];

  if(!apiUrl())
    h.push('<div class="aviso"><b>Falta conectar el Sheet.</b><br>Andá a Revisión y pegá la URL <code>/exec</code> del Apps Script. Sin eso no puedo leer tu fondo.</div>');

  // ── El aporte ──
  if(hecho){
    const a=LS.aportes.filter(function(x){return x.mes===mesISO();})[0];
    h.push('<div class="card"><div class="tag">💰 Aporte de '+MESES[new Date().getMonth()]+'</div>'+
      '<div class="mid" style="color:var(--green)">✓ '+fp(a.monto)+'</div>'+
      '<div class="sub">Hecho. Van <b>'+LS.aportes.length+'</b> '+(LS.aportes.length===1?'aporte':'aportes')+'.</div>'+
      '<div class="fuente">Acordate de actualizar <code>fondo_bs3_usd</code> en la hoja Config con el saldo real de MercadoPago.</div></div>');
  }else{
    h.push('<div class="'+(tocaAporte?'card go':'card')+'"><div class="tag">💰 Aporte de '+MESES[new Date().getMonth()]+'</div>'+
      '<div class="'+(tocaAporte?'big':'mid')+'">'+fp(LS.montoAporte)+'</div>'+
      '<div class="sub">'+(tocaAporte
        ? 'Transferilo <b>hoy</b> a MP dólares. Después del diezmo y antes de armar nada más.'
        : 'Se transfiere el día de cobro, antes que todo lo demás.')+'</div>'+
      '<div class="fila"><button class="ok" style="flex:1" onclick="marcarAporte()">Ya lo transferí</button></div>'+
      '<div class="fila"><input id="inMonto" inputmode="decimal" placeholder="Cambiar monto"><button class="ghost" onclick="guardarMonto()">Fijar</button></div></div>');
  }

  // ── El sobre ──
  const cls = tocaAporte?'mid':'big';
  if(A.sinDato){
    h.push('<div class="card"><div class="tag">🛒 Alimentación · hoy</div>'+
      '<div class="'+cls+'" style="color:var(--muted)">—</div>'+
      '<div class="sub">No sé cuánto queda. Abrí MercadoPago, mirá el sobre y cargalo acá.</div>'+
      inputSobre()+
      '<div class="fuente">Referencia: '+fp(A.ref)+'/día · giro de '+fp(LS.giro)+' los lunes.</div></div>');
  }else if(A.vencido){
    h.push('<div class="card warn"><div class="tag">🛒 Alimentación · hoy</div>'+
      '<div class="'+cls+'" style="color:var(--amber)">—</div>'+
      '<div class="sub">El saldo que tengo es de hace '+(A.horas===null?'—':Math.floor(A.horas/24)+' días')+
      '. <b>No te doy un número que ya no vale.</b> Mirá el sobre en MercadoPago.</div>'+inputSobre()+'</div>');
  }else{
    const col = A.ratio>=.95?'var(--green)':A.ratio>=.7?'var(--amber)':'var(--red)';
    h.push('<div class="card"><div class="tag">🛒 Alimentación · hoy</div>'+
      '<div class="'+cls+'" style="color:'+col+'">'+fp(A.porDia)+'</div>'+
      '<div class="barra"><i style="width:'+Math.min(100,Math.round(A.ratio*100))+'%;background:'+col+'"></i></div>'+
      '<div class="sub">Quedan <b>'+fp(A.saldo)+'</b> para <b>'+A.dias+' '+(A.dias===1?'día':'días')+'</b>. '+
      (A.ratio>=.95?'Vas holgado.':A.ratio>=.7?'Vas justo: bajá el ritmo.':'Vas corto: hasta el lunes no entra plata nueva.')+'</div>'+
      (A.excedente>0?'<div class="fuente">💚 Llevás '+fp(A.excedente)+' de más en el sobre. Es ahorro, no permiso: al cerrar el mes va al fondo.</div>':'')+
      inputSobre()+
      '<div class="fuente">Cargado '+(A.horas<1?'recién':'hace '+A.horas+' h')+' · referencia '+fp(A.ref)+'/día.</div></div>');
  }

  // ── El fondo, en chico: contexto, no acción ──
  if(F){
    const ll=llegada(F.falta,R.monto);
    h.push('<div class="card"><div class="tag">🎯 Fondo de emergencia</div>'+
      '<div class="sub" style="margin-top:0">Vas por el <b>'+Math.round(F.pct)+'%</b> — faltan <b>'+fp(F.falta)+'</b>'+(ll?', '+ll.texto:'')+'.</div>'+
      '<div class="barra"><i style="width:'+F.pct+'%"></i></div></div>');
  }
  $('hoyBody').innerHTML=h.join('');
}

// ══════════════════════════════════════════════════════════════════════
// PANTALLA "FONDO"
// ══════════════════════════════════════════════════════════════════════
const PASOS = [
  {n:1,t:'Fondo inicial US$ 1.000'},
  {n:2,t:'Eliminar todas las deudas'},
  {n:3,t:'Fondo de 3 a 6 meses'},
  {n:4,t:'Invertir 15% para el retiro'},
  {n:5,t:'Educación de los chicos'},
  {n:6,t:'Casa propia — Santa Anita'},
  {n:7,t:'Construir riqueza y dar'}
];
// El paso se DERIVA. Antes estaba escrito a mano en el HTML: al completar BS3
// la app iba a seguir diciendo "3 ←" para siempre.
function pasoActual(){ const F=fondo(); return (F && F.falta<=0) ? 4 : 3; }

function pintarFondo(){
  const F=fondo(), R=ritmo();
  if(!F){
    $('fPct').textContent='—'; $('fBar').style.width='0%';
    $('fSub').textContent = apiUrl()
      ? 'No pude leer fondo_bs3_usd, meta_bs3_minimo o la cotización. No invento el número.'
      : 'Conectá el Sheet desde Revisión.';
    $('fFuente').textContent='';
  }else{
    const ll=llegada(F.falta,R.monto);
    $('fPct').textContent=Math.round(F.pct)+'%';
    setTimeout(function(){ $('fBar').style.width=F.pct+'%'; },60);
    $('fSub').innerHTML = F.falta>0
      ? 'Faltan <b>'+fp(F.falta)+'</b> · tenés '+fusd(F.usd)+' ('+fp(F.pesos)+')'
      : '✅ Fondo completo. Arranca Baby Step 4: invertir el 15% para el retiro.';
    $('fFuente').innerHTML =
      (ll?'A '+fp(R.monto)+'/mes: <b>'+ll.meses+' meses</b> — '+ll.texto+' '+
          (R.real?'(promedio de '+R.n+' aportes reales)':'(plan, todavía sin historial)')+'.<br>':'')+
      'Fondo y meta: hoja Config. Dólar MEP '+(S.mepOk?fp(S.mep)+' de dolarapi':'no disponible')+'.'+
      '<br>El aguinaldo de junio y diciembre acorta esto de golpe si va entero.';
  }

  const h=LS.aportes;
  $('fAportes').innerHTML = h.length===0
    ? '<div class="vacio">Todavía no registraste ningún aporte.<br>Es la única métrica que dice si el sistema funciona.</div>'
    : '<div class="mid">'+h.length+' <span style="font-size:15px;font-weight:600;color:var(--muted);font-family:\'Plus Jakarta Sans\',sans-serif">'+
      (h.length===1?'aporte':'aportes')+' · '+fp(h.reduce(function(s,a){return s+a.monto;},0))+' en total</span></div>'+
      '<div class="lista">'+h.slice().reverse().map(function(a){
        const p=a.mes.split('-');
        return '<div class="item"><b>'+MESES[+p[1]-1]+' '+p[0]+'</b><span class="m">'+fp(a.monto)+'</span></div>';
      }).join('')+'</div>';

  const act=pasoActual();
  $('fPasos').innerHTML = PASOS.map(function(p){
    const est = p.n<act?'✅':p.n===act?'🟡':'⬜';
    return '<div class="item" style="'+(p.n===act?'font-weight:700':'color:var(--muted)')+'"><span>'+est+' '+p.n+'. '+p.t+'</span></div>';
  }).join('')+
  '<div class="fuente">Santa Anita es el paso 6: faltan tres. El fondo no te compra la casa — hace que un imprevisto deje de convertirse en deuda.</div>';

  $('paso').innerHTML = PASOS.map(function(p){ return '<i class="'+(p.n<act?'on':p.n===act?'now':'')+'"></i>'; }).join('');
  $('pasoTxt').textContent = 'Baby Step '+act+' — '+PASOS[act-1].t;
}

// ══════════════════════════════════════════════════════════════════════
// PANTALLA "REVISIÓN" — para el ritual mensual, no para el día a día.
// ══════════════════════════════════════════════════════════════════════
function pintarRev(){
  const C=ciclo();
  const dentro=function(g){ return g.f && g.f>=C.ini && g.f<=C.fin; };
  const gastos=S.tc.filter(dentro).concat(S.mp.filter(dentro)).sort(function(a,b){return b.f-a.f;});
  const total=gastos.reduce(function(s,g){return s+g.monto;},0);
  const dTC=diasDesde(S.ultimaTC), dMP=diasDesde(S.ultimaMP);

  const viejas=[];
  if(dTC===null||dTC>DIAS_FRESCO) viejas.push('tarjeta ('+(dTC===null?'sin datos':dTC+' días')+')');
  if(dMP===null||dMP>DIAS_FRESCO) viejas.push('MercadoPago ('+(dMP===null?'sin datos':dMP+' días')+')');
  $('revAviso').innerHTML = viejas.length
    ? '<div class="aviso"><b>Datos atrasados: '+viejas.join(' y ')+'.</b><br>Lo gastado real es MAYOR que lo de abajo — el gasto que falta cargar ya se hizo. No uses esto para decidir un gasto de hoy.</div>'
    : '';

  const f=function(d){ return d?pad2(d.getDate())+'/'+pad2(d.getMonth()+1):'—'; };
  $('rGasto').textContent = S.sheetOk?fp(total):'—';
  $('rGastoSub').innerHTML = S.sheetOk
    ? gastos.length+' movimientos · ciclo '+f(C.ini)+' → '+f(C.fin)+' · quedan '+C.dias+' días'
    : 'Sin conexión al Sheet.';
  $('rFuente').innerHTML = 'Tarjeta: '+(dTC===null?'sin datos':'último hace '+dTC+' días')+
    ' · MercadoPago: '+(dMP===null?'sin datos':'último hace '+dMP+' días')+
    '.<br>Excluye a los Padres, los gastos en dólares y los movimientos internos.';

  const porCat={};
  gastos.forEach(function(g){ porCat[g.cat]=(porCat[g.cat]||0)+g.monto; });
  const cats=Object.keys(porCat).map(function(c){return [c,porCat[c]];}).sort(function(a,b){return b[1]-a[1];});
  $('rCats').innerHTML = cats.length
    ? cats.map(function(x){ return '<div class="item"><b>'+x[0]+'</b><span class="m">'+fp(x[1])+'</span></div>'; }).join('')
    : '<div class="vacio">Sin datos del ciclo.</div>';

  $('rMovs').innerHTML = gastos.length
    ? gastos.slice(0,120).map(function(g){
        return '<div class="item"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
          f(g.f)+' · '+(g.desc.slice(0,34)||g.cat)+
          ' <span style="color:var(--muted);font-size:11px">'+g.fuente+'</span></span>'+
          '<span class="m">'+fp(g.monto)+'</span></div>';
      }).join('')
    : '<div class="vacio">Sin movimientos cargados en este ciclo.</div>';

  const b=apiUrl();
  $('cnxEstado').innerHTML = b
    ? '<b style="color:var(--green)">✓ Conectada</b> por el Apps Script.<br><span style="color:var(--muted);font-size:11px;word-break:break-all">'+b+'</span><br><span style="color:var(--muted)">Tu Sheet puede seguir privado.</span>'
    : '<b style="color:var(--red)">Sin conectar.</b> Pegá la URL <code>/exec</code> que te dio Implementar en Apps Script. Se guarda solo en este dispositivo, nunca en el repo.';
}

// ══════════════════════════════════════════════════════════════════════
// ACCIONES
// ══════════════════════════════════════════════════════════════════════
function marcarAporte(){
  const h=LS.aportes, m=mesISO();
  if(h.some(function(a){return a.mes===m;})) return;
  h.push({mes:m, monto:LS.montoAporte, fecha:hoyISO()});
  LS.aportes=h; pintar();
  avisar('🎉','Aporte '+h.length+' registrado',
    'Ahora actualizá fondo_bs3_usd en la hoja Config con el saldo real de MercadoPago.');
}
function guardarMonto(){
  const v=num($('inMonto').value);
  if(isNaN(v)||v<=0) return avisar('⚠️','Monto inválido','Escribí cuánto vas a transferir por mes, por ejemplo 80.000');
  LS.montoAporte=v; pintar();
}
function guardarSobre(){
  const v=num($('inSobre').value);
  if(isNaN(v)||v<0) return avisar('⚠️','Monto inválido','Escribí el saldo tal como lo ves en MercadoPago, por ejemplo 84.500');
  LS.setSobre(v); pintar();
}
async function probarUrl(){
  const el=$('cnxUrl'), u=(el.value||'').trim().replace(/[?&]hoja=[^&]*/g,'');
  if(!/^https:\/\/script\.google\.com\/.*\/exec$/.test(u))
    return avisar('⚠️','URL inválida','Tiene que ser la que termina en /exec, la que da "Implementar" en Apps Script.');
  try{
    const r=await fetch(u+'?hoja=Config'); if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    if(!Array.isArray(j.values)) throw new Error('La respuesta no trae datos');
    localStorage.setItem('gazelle_api_url',u); el.value='';
    await cargarTodo();
    avisar('✅','Conectada','Leyó '+j.values.length+' filas de Config. Tu Sheet puede seguir privado.');
  }catch(e){
    // Un TypeError acá casi siempre es CORS, y la causa real es una sola.
    avisar('❌','No pudo conectar', (e instanceof TypeError)
      ? 'El navegador no pudo leer la respuesta. En "Implementar", el acceso tiene que decir "Cualquiera", no "Cualquiera con cuenta de Google".'
      : String(e.message||e));
  }
}
function avisar(i,t,x){ $('mIco').textContent=i; $('mTit').textContent=t; $('mTxt').textContent=x; $('modal').classList.add('on'); }
function cerrar(){ $('modal').classList.remove('on'); }
function ir(p){
  const ps=document.querySelectorAll('.pantalla');
  for(let i=0;i<ps.length;i++) ps[i].classList.remove('on');
  $('p-'+p).classList.add('on');
  const bs=document.querySelectorAll('nav button');
  for(let i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.p===p);
  window.scrollTo(0,0);
}
function pintar(){ try{ pintarHoy(); pintarFondo(); pintarRev(); }catch(e){ console.error(e); } }

const d0=new Date();
$('hoyTxt').textContent = d0.getDate()+' de '+MESES[d0.getMonth()];
pintar();                        // se pinta ya con lo local: no espera a la red
cargarTodo();
setInterval(cargarTodo, 10*60*1000);
</script>
